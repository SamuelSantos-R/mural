name: Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ipa-build]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      # Sign In with Apple não funciona com Apple ID grátis; o sideloader assina o resto.
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project Mural.xcodeproj -scheme Mural -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MURAL_APPLE_ENTITLEMENTS="" MURAL_APPLE_SWIFT_FLAGS="" MURAL_APPLE_SIGN_IN_ENABLED=NO
      - name: Package
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Mural.app Payload/
          zip -qry Mural-unsigned.ipa Payload
          ls -lh Mural-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Mural-unsigned-ipa
          path: apps/ios/Mural-unsigned.ipa
          retention-days: 14
